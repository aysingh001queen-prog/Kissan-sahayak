<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>किसान सहायक | Kisan Sahayak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{
  --bg:#eef1e4; --card:#fffef8; --ink:#1f2a1d; --muted:#5b6656; --line:#d9dfc9;
  --field:#2c6a3b; --field-ink:#ffffff; --gold:#b97a00; --rust:#a63a10; --soft:#e4ecd2; --warn:#8a2a1a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12170f; --card:#1c2318; --ink:#e9eedb; --muted:#a7b19b; --line:#2f3a28;
    --field:#6fbf80; --field-ink:#10200f; --gold:#e3b04a; --rust:#ff9b70; --soft:#26311f; --warn:#ff9b8a;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:17px;line-height:1.5}
button,input,select{font:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

/* header + navigation */
header{background:var(--field);color:var(--field-ink)}
header .top{max-width:1040px;margin:0 auto;padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none}
.brand b{font-size:24px;font-weight:800}
.brand span{font-size:14px;opacity:.9}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hello{font-weight:600}
.hbtn{display:inline-flex;align-items:center;background:transparent;color:inherit;border:2px solid currentColor;border-radius:8px;min-height:40px;padding:4px 14px;font-weight:600;cursor:pointer;text-decoration:none}
nav{max-width:1040px;margin:0 auto;padding:0 10px 10px;display:flex;gap:6px;flex-wrap:wrap}
nav a{text-decoration:none;color:inherit;padding:6px 14px;border-radius:8px;font-weight:600;min-height:40px;display:inline-flex;align-items:center}
nav a.on{background:var(--field-ink);color:var(--field)}

/* layout */
main{max-width:1040px;margin:16px auto;padding:0 12px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
main.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:780px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h1,.card h2{margin:0 0 6px;font-weight:800}
.card h1{font-size:26px}
.card h2{font-size:21px}
.full{grid-column:1/-1}

/* forms + buttons */
label{display:block;margin:12px 0 4px;font-weight:600}
input{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{border-color:var(--field)}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--field);color:var(--field-ink);font-weight:800;font-size:18px;padding:10px 14px;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:600;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.warn{color:var(--warn)}
.err{color:var(--warn);font-weight:600}

/* home */
.narrow{max-width:420px;margin:0 auto;text-align:center}
#gbtn{display:flex;justify-content:center;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media(max-width:780px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tile:hover{border-color:var(--field)}
.tile h3{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--field)}
.tile p{margin:0;color:var(--muted);font-size:15px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600}
td.wrap{white-space:normal}
.price{font-weight:800;color:var(--rust)}
.top td{background:var(--soft)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--soft)}
tr.pick a{text-decoration:none;font-weight:800}

/* results */
.answer{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.crophead{font-size:20px;font-weight:800}
.where{color:var(--muted);font-size:15px}
.big{font-size:40px;font-weight:800;color:var(--rust);line-height:1.1;margin:6px 0 2px}
.big small{font-size:15px;font-weight:600;color:var(--muted)}
.badge{display:inline-block;border:2px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 8px;font-weight:600;font-size:14px;margin-top:4px}
.badge.live{border-color:var(--field);color:var(--field)}
.tag{display:inline-block;background:var(--soft);border-radius:5px;padding:0 7px;font-size:14px;font-weight:600;text-decoration:none;margin:2px 2px 2px 0}
a.tag:hover{background:var(--field);color:var(--field-ink)}

/* states page */
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:780px){.states{grid-template-columns:minmax(0,1fr)}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.scard h3{margin:0;font-size:20px;font-weight:800}
.scard .meta{color:var(--muted);font-size:14px;margin-bottom:6px}
.scard .more{display:inline-block;margin-top:8px;font-weight:600;color:var(--field)}

nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav a{white-space:nowrap}
select{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1 1 150px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:14px}
.kpi b{font-size:22px}
.up{color:var(--field);font-weight:800}
.down{color:var(--warn);font-weight:800}
.flat{color:var(--muted);font-weight:800}
.alert{border:2px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0}
.alert.hit{border-color:var(--field);background:var(--soft)}
.steps{margin:6px 0;padding-left:22px}
.steps li{margin:4px 0}
.btn.sm{display:inline-block;width:auto;min-height:40px;font-size:15px;margin-top:8px;padding:6px 14px}
input[type=checkbox]{width:auto;min-height:0;margin-right:6px}
.spark{width:100%;max-width:320px;height:60px;display:block}
td input{min-height:40px}

</style>
</head>

const $ = id => document.getElementById(id);
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function sstore(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function inr(n){ return "₹"+Number(n).toLocaleString("en-IN"); }
function norm(v){ return (v||"").trim().toLowerCase().replace(/\s+/g," "); }

/* name resolution: accepts Hindi or English */
function stateEN(v){
  const n=norm(v); if(!n) return "";
  for(const s in STATES){ if(norm(s)===n||norm(STATES[s].hi)===n) return s; }
  for(const a in STATE_ALIASES){ if(norm(a)===n) return STATE_ALIASES[a]; }
  return "";
}
function cropEN(v){
  const n=norm(v); if(!n) return "";
  for(const c in CROPS){ if(norm(c)===n||norm(CROPS[c].hi)===n) return c; }
  for(const a in CROP_ALIASES){ if(norm(a)===n) return CROP_ALIASES[a]; }
  return "";
}
function districtEN(v,st){
  const raw=(v||"").trim(); if(!raw) return "";
  const n=norm(raw);
  for(const d in DIST_HI){ if(norm(DIST_HI[d])===n) return d; }
  const list=(STATES[st]&&STATES[st].d)||[];
  for(const d of list){ if(norm(d)===n) return d; }
  return raw;
}
const isRohtas=(st,di)=>st==="Bihar"&&norm(di)==="rohtas";

/* prices: deterministic reference rates (not random, not live) */
function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function factor(key,range){ return 1-range+((hash(key)%1000)/1000)*range*2; }
function round(n){ return n<1000?Math.round(n):Math.round(n/10)*10; }
function statePrice(crop,st){ return round(CROPS[crop].p*factor(st+"|"+crop,0.06)); }

function cropOf(commodity){
  const c = norm(commodity);
  if (/pine|custard|sweet|water|wood apple/.test(c)) return "";
  for (const k of Object.keys(MAP)) {
    if (MAP[k].kw.some(w => new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(c))) return k;
  }
  return "";
}

async function pull(filters, limit){
  const u = new URL(API_URL);
  u.searchParams.set("api-key", apiKey());
  u.searchParams.set("format", "json");
  u.searchParams.set("limit", String(limit || 200));
  for (const k of Object.keys(filters)) u.searchParams.set("filters[" + k + "]", filters[k]);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(u.toString(), { signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    return Array.isArray(j.records) ? j.records : [];
  } finally { clearTimeout(timer); }
}

const dateTs = d => { const m = String(d || "").split("/"); return m.length === 3 ? Date.UTC(+m[2], +m[1] - 1, +m[0]) : 0; };
function cleanRows(rows){
  const out = rows.map(r => ({
    market: r.market, district: r.district, date: r.arrival_date,
    min: Number(r.min_price), max: Number(r.max_price), modal: Number(r.modal_price)
  })).filter(r => r.market && r.modal > 0);
  const latest = Math.max(0, ...out.map(r => dateTs(r.date)));
  const recent = out.filter(r => dateTs(r.date) === latest);
  const res = recent.length ? recent : out; res.all = out; return res;
}
function failStatus(e){ return /HTTP 40[13]/.test(String(e && e.message)) ? "badkey" : "error"; }

/* prices of one crop: this district, else the state. Returns {status, scope, records} */
async function liveRecords(crop, st, di){
  if (!apiKey()) return { status: "nokey" };
  const m = MAP[crop]; if (!m) return { status: "empty" };
  try {
    let rows = [], scope = "";
    if (di) for (const n of m.names) { const r = await pull({ state: st, district: di, commodity: n }); if (r.length) { rows = r; scope = "district"; break; } }
    if (!rows.length) for (const n of m.names) { const r = await pull({ state: st, commodity: n }); if (r.length) { rows = r; scope = "state"; break; } }
    if (!rows.length) {
      const all = await pull({ state: st }, 1000);
      const hit = all.filter(r => m.kw.some(k => norm(r.commodity).includes(k)));
      const inDist = hit.filter(r => norm(r.district) === norm(di));
      if (inDist.length) { rows = inDist; scope = "district"; } else if (hit.length) { rows = hit; scope = "state"; }
    }
    const records = cleanRows(rows);
    return records.length ? { status: "ok", scope, records, all: records.all } : { status: "empty" };
  } catch (e) { return { status: failStatus(e) }; }
}

/* every commodity reported in a district (latest date of each). Returns {status, records} */
async function liveDistrict(st, di){
  if (!apiKey()) return { status: "nokey" };
  try {
    const rows = (await pull({ state: st, district: di }, 1000)).map(r => ({
      commodity: r.commodity, market: r.market, date: r.arrival_date,
      min: Number(r.min_price), max: Number(r.max_price), modal: Number(r.modal_price)
    })).filter(r => r.commodity && r.market && r.modal > 0);
    const by = {};
    for (const r of rows) (by[r.commodity] = by[r.commodity] || []).push(r);
    const records = Object.keys(by).map(name => {
      const all = by[name];
      const latest = Math.max(...all.map(r => dateTs(r.date)));
      const cur = all.filter(r => dateTs(r.date) === latest);
      return {
        commodity: name, crop: cropOf(name), markets: new Set(cur.map(r => r.market)).size,
        min: Math.min(...cur.map(r => r.min)), max: Math.max(...cur.map(r => r.max)),
        avg: Math.round(cur.reduce((s, r) => s + r.modal, 0) / cur.length), date: (cur[0] || {}).date || ""
      };
    }).sort((a, b) => (b.crop ? 1 : 0) - (a.crop ? 1 : 0) || b.markets - a.markets || a.commodity.localeCompare(b.commodity));
    return records.length ? { status: "ok", records } : { status: "empty" };
  } catch (e) { return { status: failStatus(e) }; }
}

function marketsFor(st, dist){

}
function referenceRecords(crop, st, dist){
  const base = statePrice(crop, st);
  return marketsFor(st, dist).map(m => {
    const modal = round(base * factor(m.en + "|" + crop, 0.04));
    return { name: lang === "hi" ? m.hi : m.en, min: round(modal * 0.93), max: round(modal * 1.06), modal };

/* ---------- price history (built from the dates the government data returns, kept in this browser) ---------- */
const isoDate = d => { const m = String(d || "").split("/"); return m.length === 3 ? m[2] + "-" + m[1].padStart(2, "0") + "-" + m[0].padStart(2, "0") : ""; };
const dmy = iso => { const m = String(iso).split("-"); return m.length === 3 ? m[2] + "/" + m[1] : iso; };
function avgOf(a){ return Math.round(a.reduce((s, x) => s + x, 0) / a.length); }
function recordHistory(cr, st, di, live){
  if (!live || live.status !== "ok" || !live.all) return;
  const base = st + "|" + di + "|" + cr + "|" + live.scope;
  const h = jparse(store("ks_hist"), {}) || {};
  const put = (key, byDate) => {
    const cur = h[key] || {};
    for (const d of Object.keys(byDate)) cur[d] = avgOf(byDate[d]);
    const keep = Object.keys(cur).sort().slice(-60), out = {};
    keep.forEach(d => { out[d] = cur[d]; }); h[key] = out;
  };
  const all = {}, byM = {};
  for (const r of live.all) {
    const d = isoDate(r.date); if (!d) continue;
    (all[d] = all[d] || []).push(r.modal);
    const mk = base + "|m:" + r.market; byM[mk] = byM[mk] || {}; (byM[mk][d] = byM[mk][d] || []).push(r.modal);
  }
  put(base, all);
  Object.keys(byM).slice(0, 30).forEach(k => put(k, byM[k]));
  store("ks_hist", JSON.stringify(h));
}
function trendOf(key){
  const cur = (jparse(store("ks_hist"), {}) || {})[key]; if (!cur) return null;
  const dates = Object.keys(cur).sort(); if (!dates.length) return null;
  const last = dates[dates.length - 1];
  const near = (days, tol) => {
    const target = Date.parse(last) - days * 864e5; let best = null, bd = Infinity;
    for (const d of dates) { if (d === last) continue; const diff = Math.abs(Date.parse(d) - target); if (diff <= tol * 864e5 && diff < bd) { best = d; bd = diff; } }
    return best ? { d: best, v: cur[best] } : null;
  };
  const prevD = dates.length > 1 ? dates[dates.length - 2] : null;
  return { last, value: cur[last], prev: prevD ? { d: prevD, v: cur[prevD] } : null, w: near(7, 3), m: near(30, 7), series: dates.map(d => [d, cur[d]]), count: dates.length };
}
function deltaHTML(now, then){
  if (!then) return "—";
  const d = now - then.v, pct = then.v ? (d / then.v) * 100 : 0;
  const cls = Math.abs(pct) < 1 ? "flat" : d > 0 ? "up" : "down", arrow = cls === "flat" ? "→" : d > 0 ? "↑" : "↓";
  return `<span class="${cls}">${arrow} ${d > 0 ? "+" : d < 0 ? "−" : ""}${inr(Math.abs(d))} (${pct > 0 ? "+" : ""}${pct.toFixed(1)}%)</span> <small>${L("तुलना", "vs")} ${dmy(then.d)}</small>`;
}
function moodText(tr){
  if (!tr || !tr.prev) return "";
  const pct = tr.prev.v ? ((tr.value - tr.prev.v) / tr.prev.v) * 100 : 0;
  return Math.abs(pct) < 1 ? L("भाव स्थिर है", "Price is steady") : pct > 0 ? L("📈 भाव बढ़ रहा है", "📈 Price is rising") : L("📉 भाव गिर रहा है", "📉 Price is falling");
}
function spark(series){
  if (series.length < 2) return "";
  const v = series.map(s => s[1]), mn = Math.min(...v), mx = Math.max(...v), w = 300, h = 56, p = 4;
  const pts = v.map((x, i) => (p + i * (w - 2 * p) / (v.length - 1)).toFixed(1) + "," + (mx === mn ? h / 2 : h - p - (x - mn) * (h - 2 * p) / (mx - mn)).toFixed(1));
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${L("भाव का रुझान", "price trend")}"><polyline fill="none" stroke="var(--field)" stroke-width="3" points="${pts.join(" ")}"/></svg>`;
}
function trendHTML(key){
  const tr = trendOf(key);
  if (!tr || tr.count < 2) return `<p class="note">${L("इतिहास जमा हो रहा है। हर दिन ऐप खोलने पर कल / 7 दिन / 30 दिन की तुलना दिखने लगेगी।", "History is being collected. Comparisons with yesterday / 7 / 30 days appear as you open the app each day.")}</p>`;
  return `<table><tr><th>${L("तुलना", "Compare")}</th><th>${L("बदलाव", "Change")}</th></tr>
    <tr><td>${L("पिछली तारीख से", "Since last date")}</td><td>${deltaHTML(tr.value, tr.prev)}</td></tr>
    <tr><td>${L("7 दिन", "7 days")}</td><td>${deltaHTML(tr.value, tr.w)}</td></tr>
    <tr><td>${L("30 दिन", "30 days")}</td><td>${deltaHTML(tr.value, tr.m)}</td></tr></table>
    <p><b>${moodText(tr)}</b></p>${spark(tr.series)}`;
}

/* ---------- price lookup used by several pages ---------- */
async function priceNow(cr, st, di){
  const live = await liveRecords(cr, st, di);
  if (live.status === "ok") {
    recordHistory(cr, st, di, live);
    const recs = live.records, top = recs.reduce((a, b) => b.modal > a.modal ? b : a);
    return { real: true, status: "ok", scope: live.scope, recs, avg: avgOf(recs.map(r => r.modal)), min: Math.min(...recs.map(r => r.min)), max: Math.max(...recs.map(r => r.max)),
      top: { name: top.market, modal: top.modal }, date: (recs.find(r => r.date) || {}).date || "", histKey: st + "|" + di + "|" + cr + "|" + live.scope };
  }
  const recs = referenceRecords(cr, st, di);
  return { real: false, status: live.status, scope: "", recs, avg: avgOf(recs.map(r => r.modal)), min: Math.min(...recs.map(r => r.min)), max: Math.max(...recs.map(r => r.max)), top: null, date: "", histKey: "" };
}

async function jget(url, ms){

  finally { clearTimeout(timer); }
}
async function geocode(name, st){

  const res = j.results || [], s = norm(st || "").replace("nct of ", "");
  const pick = (s && res.find(r => norm(r.admin1 || "").includes(s))) || res[0];
  if (!pick) return null;

}

      <button class="btn" id="saveP" type="button">${L("सेव करें और देखें", "Save and show")}</button>

    <div id="alertsBox"></div>
    <section class="card" id="decision"><p class="note">${t("loading")}</p></section>
    <section class="card" id="monthBox"></section></main>`;
  locInit(sel, true);
  $("acres").value = pr.acres || "";
  const save = () => {
    const r = locRead(true); if (r.err) { $("msg").innerHTML = `<p class="err">${r.err}</p>`; return; }
    saveProfile({ st: r.st, di: r.di, cr: r.cr, acres: num($("acres").value) || "" });
    render();
  };

  /* what to do this month */
  const m = new Date().getMonth() + 1, mname = MONTHS[lang][m - 1];
  const sow = STATES[sel.st].c.filter(c => inRange(m, (CROP_CAL[c] || {}).sow)).map(cropName);
  const harv = STATES[sel.st].c.filter(c => inRange(m, (CROP_CAL[c] || {}).harv)).map(cropName);
  $("monthBox").innerHTML = `<h2>📅 ${L("इस महीने (" + mname + ") क्या करें", "This month (" + mname + ")")}</h2>
    <p><b>${L("बुवाई", "Sowing")}:</b> ${sow.length ? esc(sow.join(", ")) : "—"}</p>
    <p><b>${L("कटाई", "Harvest")}:</b> ${harv.length ? esc(harv.join(", ")) : "—"}</p>
    <p class="note">${L("सामान्य अनुमान है। पूरा कैलेंडर:", "General estimate. Full calendar:")} <a href="${href("calendar", { state: sel.st })}">${L("कैलेंडर देखें", "open calendar")}</a></p>`;

  /* alerts that triggered (needs government data; checked only when the app is open) */
  if (alertsList().length) checkAlerts().then(res => {
    if (my !== tok) return;
    const hits = res.filter(x => x.hit);
    $("alertsBox").innerHTML = hits.length ? hits.map(x => `<div class="alert hit">🔔 <b>${L("अलर्ट पूरा हुआ", "Alert triggered")}:</b> ${esc(alertText(x.a))} — ${L("अभी औसत", "now average")} ${inr(x.avg)}</div>`).join("") : "";
  }).catch(() => {});

  /* the decision card */
  const [p, fc] = await Promise.all([priceNow(sel.cr, sel.st, sel.di), forecastFor(sel.st, sel.di).catch(() => null)]);
  if (my !== tok) return;
  const lines = [];
  lines.push(`<div class="crophead">🌾 ${esc(cropName(sel.cr))} — <span class="price">${inr(p.avg)}/${L("क्विंटल", "quintal")}</span></div>
    <div class="where">${esc(distName(sel.di))}, ${esc(stateName(sel.st))}${p.date ? " · " + t("priceDate") + ": " + esc(p.date) : ""}</div>
    <span class="badge ${p.real ? "live" : ""}">${p.real ? t("govData") : t("estimate")}</span>`);
  if (p.real) {
    const tr = trendOf(p.histKey);
    lines.push(tr && tr.prev ? `<p>${deltaHTML(tr.value, tr.prev)} · <b>${moodText(tr)}</b></p>` : `<p class="note">${L("पिछली तारीख से तुलना कल से दिखेगी (इतिहास जमा हो रहा है)।", "Comparison with the previous date will show from tomorrow (history is building).")}</p>`);
    lines.push(`<p>🏪 <b>${L("सबसे ऊँचा भाव", "Highest price")}:</b> ${esc(p.top.name)} — ${inr(p.top.modal)} <a href="${href("compare", { state: sel.st, district: sel.di, crop: sel.cr })}">${L("किराया जोड़कर तुलना →", "compare with transport →")}</a></p>`);
  } else lines.push(`<p class="note warn">${esc(liveNote(p.status))}</p>`);
  if (fc && fc.d.time) {
    const adv = farmAdvice(fc.d, sel.cr);
    lines.push(`<p>${adv[0][0]} <b>${L("मौसम", "Weather")}:</b> ${esc(adv[0][1])} <a href="${href("weather", { state: sel.st, district: sel.di, crop: sel.cr })}">${L("पूरा मौसम →", "full forecast →")}</a></p>`);
  } else lines.push(`<p class="note">🌦️ ${L("मौसम अभी नहीं मिला।", "Weather is not available right now.")} <a href="${href("weather", { state: sel.st, district: sel.di, crop: sel.cr })}">${L("दोबारा देखें", "try again")}</a></p>`);
  const prof = pr.yieldPerAcre && pr.acres && pr.expenses !== undefined && pr.expenses !== "" ? (pr.acres * pr.yieldPerAcre * p.avg - num(pr.expenses)) : null;
  lines.push(prof !== null ? `<p>💰 <b>${L("अनुमानित मुनाफ़ा", "Estimated profit")}:</b> <span class="${prof >= 0 ? "up" : "down"}">${inr(Math.round(prof))}</span> <a href="${href("profit")}">${L("हिसाब देखें →", "see calculation →")}</a></p>`
    : `<p>💰 <a href="${href("profit", { crop: sel.cr })}">${L("मुनाफ़ा निकालें →", "Work out profit →")}</a></p>`);
  lines.push(`<div class="row"><div><label for="atp">🔔 ${L("भाव इतना होने पर बताएँ (₹/क्विंटल)", "Alert me when price reaches (₹/quintal)")}</label><input id="atp" inputmode="numeric" value="${round(p.avg * 1.05)}"></div></div>
    <button class="btn alt" id="atpBtn" type="button">${L("अलर्ट सेट करें", "Set alert")}</button><div id="atpMsg"></div>`);
  $("decision").innerHTML = lines.join("");
  $("atpBtn").addEventListener("click", () => {
    const price = Math.round(num($("atp").value)); if (!price) return;

    $("atpMsg").innerHTML = `<p class="up">✓ ${L("अलर्ट सेट हो गया। ऐप खोलने पर जाँच होगी।", "Alert set. It is checked whenever you open the app.")} <a href="${href("alerts")}">${L("सब अलर्ट", "all alerts")}</a></p>`;
  });
}

function haversine(a, b){
  const rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}

      if (!og) { msg.textContent = L("आपकी जगह नहीं मिली। दूरी ख़ुद भरें।", "Your place was not found. Enter distances yourself."); return; }
      let found = 0;
      for (let i = 0; i < ms.length; i++) {
        try { const g = await geocode(ms[i].market, sel.st); if (g) { $("dist_" + i).value = Math.round(haversine(og, g)); found++; } } catch (e) {}
      }
      recompute();
      msg.textContent = L(found + " मंडियों की दूरी मिली। जो नहीं मिली, वह ख़ुद भरें।", "Found distances for " + found + " markets. Fill the rest yourself.");
    } catch (e) { msg.textContent = L("दूरी अभी नहीं निकल पाई (इंटरनेट/सेवा)। ख़ुद भरें।", "Could not estimate distances now (internet/service). Enter them yourself."); }
    finally { btn.disabled = false; }
  });
}

  if (my !== tok) return;
  if (live.status === "ok") {
    $("todayTable").innerHTML = `<table><tr><th>${t("crop_h")}</th><th>${t("d_markets")}</th><th>${t("d_range")} (${t("perq")})</th><th>${t("modal")}</th><th>${t("d_date")}</th></tr>` +
      live.records.map(r => {
        const label = r.crop ? cropName(r.crop) : r.commodity;
        const attrs = r.crop ? ` class="pick" tabindex="0" data-href="${esc(href("prices", { state: st, district: di, crop: r.crop }))}"` : "";
        return `<tr${attrs}><td>${esc(label)}</td><td>${r.markets}</td><td>${inr(r.min)} – ${inr(r.max)}</td><td class="price">${inr(r.avg)}</td><td>${esc(r.date || "")}</td></tr>`;
      }).join("") + `</table>`;
    $("todayNote").textContent = t("govData");
  } else { $("todayTable").innerHTML = ""; $("todayNote").textContent = live.status === "empty" ? t("d_nodata") : liveNote(live.status); }
}

/* ================= SETTINGS ================= */
function settingsView(v){
  const fromFile = !!DATA_GOV_API_KEY, has = !!apiKey();
  v.innerHTML = `<main class="one">
    <section class="card"><h2>${t("keyTitle")}</h2><p class="note">${t("keyHelp")}</p>
      <p><b>${fromFile ? t("keyFile") : has ? t("keyOn") : t("keyOff")}</b></p>
      ${fromFile ? "" : `<label for="keyIn">${t("keyLabel")}</label><input id="keyIn" type="password" autocomplete="off">
      <button class="btn" id="keySave" type="button">${t("keySave")}</button>
      ${has ? `<button class="btn alt" id="keyDel" type="button">${t("keyDel")}</button>` : ""}<div id="keyMsg"></div>`}
    </section>
    <section class="card"><h2>${L("मेरा डेटा", "My data")}</h2>
      <p class="note">${L("आपकी जानकारी (राज्य, फसल, अलर्ट, भाव का इतिहास) सिर्फ़ इसी ब्राउज़र में रहती है, कहीं भेजी नहीं जाती।", "Your details (state, crop, alerts, price history) stay in this browser only and are not sent anywhere.")}</p>
      <button class="btn alt" id="clearBtn" type="button">${L("मेरा सारा सेव किया डेटा मिटाएँ (key छोड़कर)", "Erase all my saved data (except the key)")}</button><div id="clearMsg"></div>
    </section></main>`;
  if (!fromFile) {
    $("keySave").addEventListener("click", () => {
      const k = $("keyIn").value.trim();
      if (!/^[A-Za-z0-9]{16,}$/.test(k)) { $("keyMsg").innerHTML = `<p class="err">${t("keyBad")}</p>`; return; }
      store("ks_key", k); render();
    });
    const del = $("keyDel"); if (del) del.addEventListener("click", () => { try { localStorage.removeItem("ks_key"); } catch (e) {} render(); });
  }
  $("clearBtn").addEventListener("click", () => {
    ["ks_profile", "ks_hist", "ks_alerts"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
    $("clearMsg").innerHTML = `<p class="up">✓ ${L("मिटा दिया।", "Erased.")}</p>`;
  });
}

/* ================= router ================= */
const VIEWS = { "": todayView, prices: pricesView, weather: weatherView, doctor: doctorView, profit: profitView, compare: compareView,
  alerts: alertsView, schemes: schemesView, calendar: calendarView, help: helpView, states: statesView, district: districtView, settings: settingsView };
function render(){
  tok++;
  const r = route(), view = VIEWS[r.path] || todayView;
  document.documentElement.lang = lang;
  buildHeader(VIEWS[r.path] ? r.path : "");
  const p = view($("view"), r.q);
  if (p && p.catch) p.catch(e => { if (window.__ksDebug) console.error(e); });
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const tr = e.target.closest("tr.pick"); if (tr) location.hash = tr.dataset.href;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter") { const tr = e.target.closest && e.target.closest("tr.pick"); if (tr) location.hash = tr.dataset.href; }
});
render();

</script>
</body>
